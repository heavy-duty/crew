name: ci-floor
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['fleet-floor/**', '.github/workflows/ci-floor.yml']
  # The floor's own paths only (#756): the no-browser half of this suite runs
  # in ci-shell's matrix on every engine change, so this workflow — the
  # browser walk — runs when the floor moves, weekly on main, and by hand on a
  # candidate (`gh workflow run ci-floor.yml --ref X.Y.Z-rcN`, recorded in the
  # candidate's drill record).
  push:
    branches: [main]
    paths: ['fleet-floor/**', '.github/workflows/ci-floor.yml']
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ci-floor
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Floor-only PRs must not escape the shell gates that covered these files
      # before the split.
      - name: bash -n (floor syntax)
        run: |
          set -e
          for f in fleet-floor/build.sh fleet-floor/server/probe.sh fleet-floor/test/run.sh fleet-floor/test/*.sh fleet-floor/test/floor/*.sh fleet-floor/test/stub-box; do
            bash -n "$f"
          done
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: shellcheck-cache
        with:
          path: ~/.local/bin/shellcheck
          key: shellcheck-v0.10.0-linux-x86_64
      - if: steps.shellcheck-cache.outputs.cache-hit != 'true'
        run: .github/ci/fetch-shellcheck.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: shellcheck (floor)
        run: |
          shellcheck -x fleet-floor/build.sh fleet-floor/server/probe.sh fleet-floor/test/*.sh fleet-floor/test/floor/*.sh fleet-floor/test/stub-box
      - name: python syntax (collector)
        run: python3 -m py_compile fleet-floor/server/floor.py fleet-floor/server/floor/*.py
      - name: fleet-floor tests (collector + page)
        run: |
          npm install --no-save playwright-core >/dev/null
          for c in "$CHROME_PATH" /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            [ -n "$c" ] && [ -x "$c" ] && { export PW_CHROME="$c"; break; }
          done
          echo "browser: ${PW_CHROME:-<none found>}"
          FLOOR_TEST_REQUIRE_BROWSER=1 fleet-floor/test/run.sh
      - name: index.html is up to date
        run: |
          fleet-floor/build.sh
          git diff --exit-code -- fleet-floor/index.html \
            || { echo "::error::fleet-floor/index.html is stale — run fleet-floor/build.sh"; exit 1; }
